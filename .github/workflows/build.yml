name: Build Minimal FFmpeg

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            diffutils
            pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm

      - name: Build Windows Binary
        run: |
          git clone --depth 1 --branch n7.1.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --disable-all \
            --enable-cross-compile \
            --arch=x86_64 \
            --target-os=mingw32 \
            --enable-ffmpeg \
            --enable-avdevice \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-avfilter \
            --enable-swscale \
            --enable-indev=dshow \
            --enable-decoder=mjpeg,rawvideo \
            --enable-encoder=rawvideo \
            --enable-muxer=rawvideo \
            --enable-demuxer=rawvideo \
            --enable-protocol=pipe \
            --enable-parser=mjpeg \
            --enable-filter=scale \
            --disable-iconv \
            --disable-zlib \
            --disable-schannel \
            --enable-small \
            --disable-doc \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-network \
            --disable-debug \
            --pkg-config=pkg-config \
            --extra-ldflags=-static
          make -j$(nproc) ffmpeg.exe
          mkdir -p ../dist
          cp ffmpeg.exe ../dist/ffmpeg-windows-x86_64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x86_64
          path: dist/ffmpeg-windows-x86_64.exe

  build-linux:
    name: Build Linux x86_64 (v4l2 for Debian / Fedora / Arch)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config git libv4l-dev

      - name: Build Linux Binary
        run: |
          git clone --depth 1 --branch n7.1.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --disable-all \
            --arch=x86_64 \
            --target-os=linux \
            --enable-ffmpeg \
            --enable-avdevice \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-avfilter \
            --enable-swscale \
            --enable-indev=v4l2 \
            --enable-decoder=mjpeg,rawvideo \
            --enable-encoder=rawvideo \
            --enable-muxer=rawvideo \
            --enable-demuxer=rawvideo \
            --enable-protocol=pipe \
            --enable-parser=mjpeg \
            --enable-filter=scale \
            --disable-iconv \
            --disable-zlib \
            --enable-small \
            --disable-doc \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-network \
            --disable-debug \
            --pkg-config=pkg-config \
            --extra-ldflags=-static
          make -j$(nproc) ffmpeg
          mkdir -p ../dist
          cp ffmpeg ../dist/ffmpeg-linux-x86_64
          chmod +x ../dist/ffmpeg-linux-x86_64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-x86_64
          path: dist/ffmpeg-linux-x86_64

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew install nasm pkg-config

      - name: Build macOS Binary
        run: |
          git clone --depth 1 --branch n7.1.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --disable-all \
            --arch=${{ matrix.arch }} \
            --target-os=darwin \
            --enable-ffmpeg \
            --enable-avdevice \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-avfilter \
            --enable-swscale \
            --enable-indev=avfoundation \
            --enable-decoder=mjpeg,rawvideo \
            --enable-encoder=rawvideo \
            --enable-muxer=rawvideo \
            --enable-demuxer=rawvideo \
            --enable-protocol=pipe \
            --enable-parser=mjpeg \
            --enable-filter=scale \
            --disable-iconv \
            --disable-zlib \
            --enable-small \
            --disable-doc \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-network \
            --disable-debug \
            --pkg-config=pkg-config
          make -j$(sysctl -n hw.ncpu) ffmpeg
          mkdir -p ../dist
          cp ffmpeg ../dist/ffmpeg-macos-${{ matrix.arch }}
          chmod +x ../dist/ffmpeg-macos-${{ matrix.arch }}

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-${{ matrix.arch }}
          path: dist/ffmpeg-macos-${{ matrix.arch }}

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          tag_name: ${{ github.ref_name }}
          name: FFmpeg Minimal ${{ github.ref_name }}
          draft: false
          prerelease: false
