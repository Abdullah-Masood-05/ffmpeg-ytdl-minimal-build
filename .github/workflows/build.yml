name: Build minimal FFmpeg for yt-dlp

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-zlib

      - name: Build ffmpeg.exe and ffprobe.exe
        run: ./build.sh

      - name: Smoke test
        run: ./smoke_test.sh dist/ffmpeg.exe dist/ffprobe.exe

      - name: Rename for release
        run: |
          mkdir -p out
          cp dist/ffmpeg.exe out/ffmpeg-windows-x86_64.exe
          cp dist/ffprobe.exe out/ffprobe-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x86_64
          path: out/*

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config git curl zlib1g-dev file

      - name: Build ffmpeg and ffprobe
        run: ./build.sh

      - name: Check the binaries are static
        run: |
          file dist/ffmpeg dist/ffprobe
          file dist/ffmpeg | grep -q 'statically linked'

      - name: Smoke test
        run: ./smoke_test.sh dist/ffmpeg dist/ffprobe

      - name: Rename for release
        run: |
          mkdir -p out
          cp dist/ffmpeg out/ffmpeg-linux-x86_64
          cp dist/ffprobe out/ffprobe-linux-x86_64
          chmod +x out/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-x86_64
          path: out/*

  build-macos:
    name: Build macOS arm64
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      MACOS_CFLAGS: -mmacosx-version-min=11.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install nasm pkg-config

      - name: Build ffmpeg and ffprobe
        run: ./build.sh

      - name: Check the binaries only link system libraries
        run: |
          otool -L dist/ffmpeg dist/ffprobe
          if otool -L dist/ffmpeg dist/ffprobe | tail -n +2 | grep -v ':$' | grep -vE '^\s+(/usr/lib/|/System/)'; then
            echo "non-system library linked" >&2; exit 1
          fi

      - name: Smoke test
        run: ./smoke_test.sh dist/ffmpeg dist/ffprobe

      - name: Rename for release
        run: |
          mkdir -p out
          cp dist/ffmpeg out/ffmpeg-macos-arm64
          cp dist/ffprobe out/ffprobe-macos-arm64
          chmod +x out/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: out/*

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist-release
          chmod +x ffmpeg-linux-x86_64 ffprobe-linux-x86_64 ffmpeg-macos-arm64 ffprobe-macos-arm64
          sha256sum ffmpeg-* ffprobe-* | tee SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          name: FFmpeg 7.1.1 minimal for yt-dlp ${{ github.ref_name }}
          body: |
            Minimal LGPL static FFmpeg n7.1.1 (`ffmpeg` + `ffprobe`) with exactly what yt-dlp needs:
            merging video + audio into mp4/mkv/webm, audio extraction to mp3/m4a/opus/wav/flac,
            thumbnail conversion and embedding, and metadata.

            | Platform | Files |
            |---|---|
            | Windows x86_64 | `ffmpeg-windows-x86_64.exe`, `ffprobe-windows-x86_64.exe` |
            | Linux x86_64 (static) | `ffmpeg-linux-x86_64`, `ffprobe-linux-x86_64` |
            | macOS arm64 (11.0+) | `ffmpeg-macos-arm64`, `ffprobe-macos-arm64` |

            Verify downloads with `SHA256SUMS.txt`.

            **Licenses:** FFmpeg is LGPL-2.1-or-later, built from the unmodified upstream `n7.1.1` tag
            with `build.sh` in this repository (no `--enable-gpl` / `--enable-nonfree`).
            Statically linked: LAME 3.100 (LGPL) and libopus 1.5.2 (BSD-3-Clause).
