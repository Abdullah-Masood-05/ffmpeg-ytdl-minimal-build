name: Build minimal FFmpeg for yt-dlp (Windows x64)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            diffutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-zlib

      - name: Build ffmpeg.exe and ffprobe.exe
        run: ./build.sh

      - name: Smoke test
        run: |
          ./dist/ffmpeg.exe -hide_banner -version
          ./dist/ffmpeg.exe -hide_banner -bsfs | grep -q '^setts'
          ./dist/ffprobe.exe -hide_banner -version
          cd dist && sha256sum ffmpeg.exe ffprobe.exe | tee SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ytdl-win64
          path: |
            dist/ffmpeg.exe
            dist/ffprobe.exe
            dist/SHA256SUMS.txt

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-ytdl-win64
          path: dist

      - name: Package
        run: |
          cd dist
          zip ../ffmpeg-7.1.1-ytdl-win64.zip ffmpeg.exe ffprobe.exe SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ffmpeg-7.1.1-ytdl-win64.zip
            dist/ffmpeg.exe
            dist/ffprobe.exe
            dist/SHA256SUMS.txt
          name: FFmpeg 7.1.1 minimal for yt-dlp ${{ github.ref_name }}
